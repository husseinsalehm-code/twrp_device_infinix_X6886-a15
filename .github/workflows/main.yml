name: Build OrangeFox X6886 Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1
      DEVICE: X6886

    steps:

      - name: Free disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libxml2-utils \
            xsltproc \
            zstd \
            lz4 \
            liblz4-tool \
            android-sdk-platform-tools

          git --version
          python3 --version
          rsync --version | head -1
          df -h

      - name: Install repo tool
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -L --fail \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Sync OrangeFox 12.1
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/OrangeFox_sync"

          cd "$HOME/OrangeFox_sync"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          cd sync

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"

      - name: Clone X6886 device tree
        shell: bash
        run: |
          set -eux

          mkdir -p "$FOX_PATH/device/infinix"

          git clone --depth=1 \
            -b fox_12.1-a15 \
            https://github.com/husseinsalehm-code/twrp_device_infinix_X6886-a15.git \
            "$FOX_PATH/device/infinix/X6886"

          cd "$FOX_PATH/device/infinix/X6886"

          git log -1 --oneline

          echo "Device tree:"
          ls -la

      - name: Download stock Android 16 vendor_boot
        shell: bash
        run: |
          set -eux

          mkdir -p \
            "$FOX_PATH/device/infinix/X6886/prebuilt"

          curl -L --fail --retry 3 \
            -o "$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img" \
            "https://github.com/husseinsalehm-code/twrp_device_infinix_X6886-a15/releases/download/vendorboot-stock/vendor_boot.img"

          echo "Stock vendor_boot:"
          ls -lh \
            "$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

          file \
            "$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

      - name: Verify vendor_boot
        shell: bash
        run: |
          set -eux

          VENDOR_BOOT="$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

          test -s "$VENDOR_BOOT"

          SIZE=$(stat -c%s "$VENDOR_BOOT")

          echo "vendor_boot size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: vendor_boot.img is unexpectedly small."
            exit 1
          fi

          echo "vendor_boot file looks valid."

      - name: Prepare OrangeFox configuration
        shell: bash
        run: |
          set -eux

          cd "$FOX_PATH"

          DEVICE_TREE="$FOX_PATH/device/infinix/X6886"
          VENDOR_BOOT="$DEVICE_TREE/prebuilt/vendor_boot.img"

          test -f "$VENDOR_BOOT"

          echo "Checking vendorsetup.sh..."

          if [ -f "$DEVICE_TREE/vendorsetup.sh" ]; then
            cat "$DEVICE_TREE/vendorsetup.sh"
          else
            echo "ERROR: vendorsetup.sh not found"
            exit 1
          fi

          echo "Checking BoardConfig..."

          find "$DEVICE_TREE" \
            -maxdepth 2 \
            -type f \
            \( -name "BoardConfig*.mk" -o -name "AndroidProducts.mk" -o -name "device.mk" \) \
            -print

      - name: Build OrangeFox vendor_boot
        shell: bash
        run: |
          cd "$FOX_PATH"

          set -x

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          export FOX_VENDOR_BOOT_RECOVERY=1

          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          echo "FOX_PATH=$FOX_PATH"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"

          echo "Reference vendor_boot:"
          ls -lh "$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          echo "Starting Android/OrangeFox environment..."

          set +e
          source build/envsetup.sh
          source_status=$?
          set -e

          echo "envsetup exit code: $source_status"

          if [ "$source_status" -ne 0 ]; then
            if [ -s "$FOX_PATH/frameworks/base/services/core/xsd/vts/Android.mk" ]; then
              echo "Known OrangeFox VTS Android.mk condition detected."
              echo "Continuing with build."
            else
              echo "ERROR: build/envsetup.sh failed unexpectedly."
              exit "$source_status"
            fi
          fi

          echo "Selecting X6886..."

          lunch ofox_X6886-eng

          echo "Building vendor_boot..."

          mka vendorbootimage

      - name: Verify build output
        shell: bash
        run: |
          set -eux

          OUT="$FOX_PATH/out/target/product/X6886"

          echo "Output directory:"
          ls -lah "$OUT" || true

          echo
          echo "Image files:"
          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            -print \
            -exec ls -lh {} \;

          echo
          echo "ZIP files:"
          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print \
            -exec ls -lh {} \;

          echo
          echo "Important vendor_boot outputs:"
          find "$OUT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*vendor_boot*.img" \
              -o \
              -name "OrangeFox*.img" \
              -o \
              -name "OrangeFox*.zip" \
            \) \
            -print

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6886-Android16
          path: |
            ${{ github.workspace }}/fox_12.1/out/target/product/X6886/*.img
            ${{ github.workspace }}/fox_12.1/out/target/product/X6886/*.zip
          if-no-files-found: error
          retention-days: 7
