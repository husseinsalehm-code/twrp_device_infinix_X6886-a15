name: Build OrangeFox X6886 Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1
      DEVICE: X6886

    steps:

      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          df -h

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libxml2-utils \
            xsltproc \
            zstd \
            lz4 \
            liblz4-tool

          git --version
          python3 --version
          df -h

      - name: Install repo tool
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -L --fail \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Sync OrangeFox 12.1
        run: |
          set -eux

          mkdir -p "$HOME/OrangeFox_sync"

          cd "$HOME/OrangeFox_sync"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          cd sync

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"

      - name: Clone X6886 device tree
        run: |
          set -eux

          mkdir -p "$FOX_PATH/device/infinix"

          git clone --depth=1 \
            -b fox_12.1-a15 \
            https://github.com/husseinsalehm-code/twrp_device_infinix_X6886-a15.git \
            "$FOX_PATH/device/infinix/X6886"

          echo "Device tree:"
          ls -la "$FOX_PATH/device/infinix/X6886"

      - name: Download stock Android 16 vendor_boot
        run: |
          set -eux

          mkdir -p \
            "$FOX_PATH/device/infinix/X6886/prebuilt"

          curl -L --fail --retry 3 \
            -o "$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img" \
            "https://github.com/husseinsalehm-code/twrp_device_infinix_X6886-a15/releases/download/vendorboot-stock/vendor_boot.img"

          ls -lh \
            "$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

          test -s \
            "$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

      - name: Prepare OrangeFox environment
        run: |
          set -eux

          VTS_DIR="$FOX_PATH/frameworks/base/services/core/xsd/vts"
          VTS_FILE="$VTS_DIR/Android.mk"

          mkdir -p "$VTS_DIR"

          echo "# OrangeFox VTS placeholder for X6886" > "$VTS_FILE"

          echo "Created:"
          ls -lh "$VTS_FILE"

          test -s "$VTS_FILE"

      - name: Build OrangeFox vendor_boot
        run: |
          set -eux

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          export FOX_VENDOR_BOOT_RECOVERY=1

          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$FOX_PATH/device/infinix/X6886/prebuilt/vendor_boot.img"

          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          echo "========================================"
          echo "OrangeFox X6886 Android 16"
          echo "========================================"

          echo "FOX_PATH=$FOX_PATH"
          echo "DEVICE=$DEVICE"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"

          echo "Checking vendor_boot..."

          ls -lh \
            "$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          test -s \
            "$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          echo "Starting build environment..."

          source build/envsetup.sh

          echo "Environment loaded successfully."

          echo "Selecting X6886..."

          lunch ofox_X6886-eng

          echo "Starting vendor_boot build..."

          mka vendorbootimage

      - name: Verify build output
        run: |
          set -eux

          OUT="$FOX_PATH/out/target/product/X6886"

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          test -d "$OUT"

          ls -lah "$OUT"

          echo
          echo "IMG files:"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            -print \
            -exec ls -lh {} \;

          echo
          echo "ZIP files:"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print \
            -exec ls -lh {} \;

          echo
          echo "OrangeFox files:"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "OrangeFox*.img" \
              -o \
              -name "OrangeFox*.zip" \
              -o \
              -name "*vendor_boot*.img" \
            \) \
            -print \
            -exec ls -lh {} \;

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6886-Android16
          path: |
            ${{ github.workspace }}/fox_12.1/out/target/product/X6886/*.img
            ${{ github.workspace }}/fox_12.1/out/target/product/X6886/*.zip
          if-no-files-found: error
          retention-days: 7
